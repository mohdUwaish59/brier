[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "brier"
version = "0.0.0"
description = "Calibrated typed decisions (choice / yes-no / score) from open LLMs, without generation or fine-tuning."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mohd Uwaish" }]
keywords = ["llm", "calibration", "classification", "decision", "logits"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.45", "safetensors>=0.4"]
bench = ["brier[hf]", "datasets>=2.18"]

[project.urls]
Homepage = "https://github.com/mohdUwaish59/brier"
Issues = "https://github.com/mohdUwaish59/brier/issues"
Changelog = "https://github.com/mohdUwaish59/brier/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brier"]

[tool.hatch.build.targets.sdist]
include = ["src/brier", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "NPY", "C4", "D", "N"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "datasets.*", "safetensors.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
markers = ["integration: loads a real model (slow, needs download; run with -m integration)"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["brier"]
branch = true
omit = ["*/backends/hf.py", "*/bench/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
