name: Feature request
description: Propose a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour or API
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references (papers, benchmarks)
