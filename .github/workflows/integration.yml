name: Integration
# Real models on CPU with the newest torch / transformers / numpy that users would install,
# so an upstream release that breaks brier shows up here before users report it.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: true

jobs:
  latest-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BRIER_TEST_MODELS: qwen3,smollm2,granitemoe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
      # --upgrade resolves the newest allowed versions; the changed lock file is not committed.
      - run: uv sync --all-extras --upgrade
      - run: uv pip list | grep -E "^(torch|transformers|numpy|safetensors) "
      - run: uv run --no-sync brier check Qwen/Qwen3-0.6B --revision c1899de289a04d12100db370d81485cdf75e47ca --dtype float32
      - run: uv run --no-sync pytest -m integration -p no:cacheprovider
